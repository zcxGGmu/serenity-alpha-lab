<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Serenity Alpha Lab Research Generation Flow</title>
  <desc id="desc">Claude Official style process flow showing topic resolution, candidate expansion, evidence retrieval, scoring, readiness, memo generation, UI publication, and run-state persistence.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { fill: #1a1a1a; font-size: 25px; font-weight: 700; }
    .subtitle { fill: #6a6a6a; font-size: 14px; font-weight: 400; }
    .node-title { fill: #1a1a1a; font-size: 16px; font-weight: 700; }
    .node-text { fill: #1a1a1a; font-size: 13px; font-weight: 400; }
    .label { fill: #5a5a5a; font-size: 12px; font-weight: 600; }
    .stage { fill: #6a6a6a; font-size: 13px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-claude" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#5a5a5a"/>
    </marker>
    <filter id="shadow-soft" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="820" fill="#f8f6f3"/>
  <text x="600" y="42" text-anchor="middle" class="title">Research Generation Flow</text>
  <text x="600" y="66" text-anchor="middle" class="subtitle">From a local query to bilingual dashboards, research memos, evidence tasks, and durable run records</text>

  <path d="M 270 150 L 390 150" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 510 150 L 630 150" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 750 150 L 870 150" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 990 174 L 990 240 L 270 240 L 270 286" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 270 390 L 390 390" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 510 390 L 630 390" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 750 390 L 870 390" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 990 414 L 990 480 L 270 480 L 270 526" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 270 630 L 390 630" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 510 630 L 630 630" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 750 630 L 870 630" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>

  <rect x="305" y="138" width="88" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="349" y="155" text-anchor="middle" class="label">resolve()</text>
  <rect x="548" y="138" width="80" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="588" y="155" text-anchor="middle" class="label">rank</text>
  <rect x="790" y="138" width="76" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="828" y="155" text-anchor="middle" class="label">score</text>
  <rect x="310" y="378" width="82" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="351" y="395" text-anchor="middle" class="label">gate</text>
  <rect x="548" y="378" width="82" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="589" y="395" text-anchor="middle" class="label">write</text>
  <rect x="790" y="378" width="82" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="831" y="395" text-anchor="middle" class="label">build</text>
  <rect x="548" y="618" width="82" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="589" y="635" text-anchor="middle" class="label">persist</text>

  <g filter="url(#shadow-soft)">
    <rect x="90" y="104" width="180" height="92" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="180" y="136" text-anchor="middle" class="node-title">User Query</text>
    <text x="180" y="159" text-anchor="middle" class="node-text">industry/theme/ticker</text>
    <text x="180" y="180" text-anchor="middle" class="node-text">ZH or EN launch</text>

    <rect x="390" y="104" width="180" height="92" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="480" y="136" text-anchor="middle" class="node-title">Topic Resolver</text>
    <text x="480" y="159" text-anchor="middle" class="node-text">alias expansion</text>
    <text x="480" y="180" text-anchor="middle" class="node-text">candidate_tickers</text>

    <rect x="630" y="104" width="180" height="92" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="720" y="136" text-anchor="middle" class="node-title">Evidence Retrieval</text>
    <text x="720" y="159" text-anchor="middle" class="node-text">retrieve(top_k=limit)</text>
    <text x="720" y="180" text-anchor="middle" class="node-text">ticker + theme boosts</text>

    <rect x="870" y="104" width="180" height="92" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="960" y="136" text-anchor="middle" class="node-title">Scorecard</text>
    <text x="960" y="159" text-anchor="middle" class="node-text">6 weighted factors</text>
    <text x="960" y="180" text-anchor="middle" class="node-text">rating + confidence</text>

    <rect x="90" y="286" width="180" height="128" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="180" y="321" text-anchor="middle" class="node-title">Readiness Scan</text>
    <text x="180" y="344" text-anchor="middle" class="node-text">primary/fact depth</text>
    <text x="180" y="365" text-anchor="middle" class="node-text">risk coverage</text>
    <text x="180" y="386" text-anchor="middle" class="node-text">ready / needs_work</text>

    <rect x="390" y="286" width="180" height="128" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="480" y="321" text-anchor="middle" class="node-title">Memo Pack</text>
    <text x="480" y="344" text-anchor="middle" class="node-text">generate_memo()</text>
    <text x="480" y="365" text-anchor="middle" class="node-text">index + sources</text>
    <text x="480" y="386" text-anchor="middle" class="node-text">gap reports if UI run</text>

    <rect x="630" y="286" width="180" height="128" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="720" y="321" text-anchor="middle" class="node-title">Operational Reports</text>
    <text x="720" y="344" text-anchor="middle" class="node-text">coverage matrix</text>
    <text x="720" y="365" text-anchor="middle" class="node-text">acquisition queue</text>
    <text x="720" y="386" text-anchor="middle" class="node-text">deliverable report</text>

    <rect x="870" y="286" width="180" height="128" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="960" y="321" text-anchor="middle" class="node-title">Dashboard Builder</text>
    <text x="960" y="344" text-anchor="middle" class="node-text">build_dashboard()</text>
    <text x="960" y="365" text-anchor="middle" class="node-text">index.html</text>
    <text x="960" y="386" text-anchor="middle" class="node-text">index.zh.html</text>

    <rect x="90" y="526" width="180" height="128" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="180" y="561" text-anchor="middle" class="node-title">Local Server</text>
    <text x="180" y="584" text-anchor="middle" class="node-text">Threading TCPServer</text>
    <text x="180" y="605" text-anchor="middle" class="node-text">serve-ui</text>
    <text x="180" y="626" text-anchor="middle" class="node-text">report drawer routes</text>

    <rect x="390" y="526" width="180" height="128" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="480" y="561" text-anchor="middle" class="node-title">Run Records</text>
    <text x="480" y="584" text-anchor="middle" class="node-text">runs.json</text>
    <text x="480" y="605" text-anchor="middle" class="node-text">queued/running/done</text>
    <text x="480" y="626" text-anchor="middle" class="node-text">attempt + retry_of</text>

    <rect x="630" y="526" width="180" height="128" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="720" y="561" text-anchor="middle" class="node-title">Project Store</text>
    <text x="720" y="584" text-anchor="middle" class="node-text">projects + events</text>
    <text x="720" y="605" text-anchor="middle" class="node-text">owners + filters</text>
    <text x="720" y="626" text-anchor="middle" class="node-text">handoff audits</text>

    <rect x="870" y="526" width="180" height="128" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="960" y="561" text-anchor="middle" class="node-title">User Outputs</text>
    <text x="960" y="584" text-anchor="middle" class="node-text">dashboard links</text>
    <text x="960" y="605" text-anchor="middle" class="node-text">research-only reports</text>
    <text x="960" y="626" text-anchor="middle" class="node-text">handoff brief</text>
  </g>

  <rect x="398" y="718" width="404" height="42" rx="10" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="600" y="744" text-anchor="middle" class="stage">Safety invariant: generated outputs remain research-only and require independent verification.</text>
</svg>
