<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-labelledby="title desc">
  <title id="title">Serenity Alpha Lab System Architecture</title>
  <desc id="desc">Claude Official style architecture diagram showing local evidence inputs, Python engine modules, generated UI, durable JSON state, and research-only outputs.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { fill: #1a1a1a; font-size: 25px; font-weight: 700; }
    .subtitle { fill: #6a6a6a; font-size: 14px; font-weight: 400; }
    .layer { fill: #6a6a6a; font-size: 14px; font-weight: 700; letter-spacing: .3px; }
    .node-title { fill: #1a1a1a; font-size: 16px; font-weight: 700; }
    .node-text { fill: #1a1a1a; font-size: 13px; font-weight: 400; }
    .label { fill: #5a5a5a; font-size: 12px; font-weight: 600; }
    .legend-title { fill: #1a1a1a; font-size: 13px; font-weight: 700; }
    .legend-text { fill: #6a6a6a; font-size: 12px; font-weight: 400; }
  </style>
  <defs>
    <marker id="arrow-claude" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#5a5a5a"/>
    </marker>
    <filter id="shadow-soft" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1280" height="860" fill="#f8f6f3"/>
  <text x="640" y="42" text-anchor="middle" class="title">Serenity Alpha Lab System Architecture</text>
  <text x="640" y="66" text-anchor="middle" class="subtitle">Local-first evidence engine, bilingual dashboard, durable workflow state, and research-only delivery</text>

  <text x="42" y="142" class="layer">Inputs</text>
  <text x="42" y="318" class="layer">Engine</text>
  <text x="42" y="508" class="layer">Product</text>
  <text x="42" y="690" class="layer">State</text>

  <path d="M 260 172 L 260 226 L 245 226 L 245 270" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 600 172 L 600 226 L 585 226 L 585 270" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 940 172 L 940 226 L 925 226 L 925 270" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <rect x="217" y="214" width="96" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="265" y="231" text-anchor="middle" class="label">load JSONL</text>
  <rect x="556" y="214" width="98" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="605" y="231" text-anchor="middle" class="label">load config</text>
  <rect x="895" y="214" width="98" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="944" y="231" text-anchor="middle" class="label">import data</text>

  <path d="M 245 382 L 245 420 L 285 420 L 285 454" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 585 382 L 585 420 L 600 420 L 600 454" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 925 382 L 925 420 L 915 420 L 915 454" stroke="#5a5a5a" stroke-width="2" fill="none" marker-end="url(#arrow-claude)"/>
  <rect x="286" y="408" width="96" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="334" y="425" text-anchor="middle" class="label">rank/score</text>
  <rect x="558" y="408" width="92" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="604" y="425" text-anchor="middle" class="label">gate quality</text>
  <rect x="872" y="408" width="96" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="920" y="425" text-anchor="middle" class="label">build pages</text>

  <path d="M 285 566 L 285 620 L 235 620 L 235 650" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 600 566 L 600 620 L 600 650" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-claude)"/>
  <path d="M 915 566 L 915 620 L 965 620 L 965 650" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-claude)"/>
  <rect x="552" y="608" width="126" height="24" rx="6" fill="#f8f6f3" fill-opacity="0.95"/>
  <text x="615" y="625" text-anchor="middle" class="label">persist state</text>

  <g filter="url(#shadow-soft)">
    <rect x="140" y="104" width="240" height="92" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="260" y="137" text-anchor="middle" class="node-title">Evidence JSONL</text>
    <text x="260" y="160" text-anchor="middle" class="node-text">data/enriched + primary</text>
    <text x="260" y="181" text-anchor="middle" class="node-text">fact/risk/invalidation records</text>

    <rect x="480" y="104" width="240" height="92" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="600" y="137" text-anchor="middle" class="node-title">Config Catalogs</text>
    <text x="600" y="160" text-anchor="middle" class="node-text">stock universe + ticker rules</text>
    <text x="600" y="181" text-anchor="middle" class="node-text">financial metrics + sources</text>

    <rect x="820" y="104" width="240" height="92" rx="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="940" y="137" text-anchor="middle" class="node-title">Importers</text>
    <text x="940" y="160" text-anchor="middle" class="node-text">GitHub, SEC companyfacts</text>
    <text x="940" y="181" text-anchor="middle" class="node-text">official reports, manual intake</text>

    <rect x="125" y="270" width="240" height="112" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="245" y="303" text-anchor="middle" class="node-title">Evidence Core</text>
    <text x="245" y="326" text-anchor="middle" class="node-text">evidence.py validation</text>
    <text x="245" y="347" text-anchor="middle" class="node-text">dedupe + claim typing</text>
    <text x="245" y="368" text-anchor="middle" class="node-text">retrieval.py ranking</text>

    <rect x="465" y="270" width="240" height="112" rx="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="585" y="303" text-anchor="middle" class="node-title">Research Engine</text>
    <text x="585" y="326" text-anchor="middle" class="node-text">topic_resolver.py</text>
    <text x="585" y="347" text-anchor="middle" class="node-text">scoring.py + readiness.py</text>
    <text x="585" y="368" text-anchor="middle" class="node-text">coverage/acquisition builders</text>

    <rect x="805" y="270" width="240" height="112" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="925" y="303" text-anchor="middle" class="node-title">CLI Orchestrator</text>
    <text x="925" y="326" text-anchor="middle" class="node-text">serenity_alpha_lab.cli</text>
    <text x="925" y="347" text-anchor="middle" class="node-text">run-cpo-pack, build-ui</text>
    <text x="925" y="368" text-anchor="middle" class="node-text">doctor, scans, serve-ui</text>

    <rect x="175" y="454" width="220" height="112" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="285" y="487" text-anchor="middle" class="node-title">Memo Pack</text>
    <text x="285" y="510" text-anchor="middle" class="node-text">memo_pack.py + memo.py</text>
    <text x="285" y="531" text-anchor="middle" class="node-text">index.md, sources.md</text>
    <text x="285" y="552" text-anchor="middle" class="node-text">ticker memos + gaps</text>

    <rect x="490" y="454" width="220" height="112" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="600" y="487" text-anchor="middle" class="node-title">Bilingual UI</text>
    <text x="600" y="510" text-anchor="middle" class="node-text">ui.py static HTML</text>
    <text x="600" y="531" text-anchor="middle" class="node-text">index.html + index.zh.html</text>
    <text x="600" y="552" text-anchor="middle" class="node-text">report drawer + Run Center</text>

    <rect x="805" y="454" width="220" height="112" rx="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="915" y="487" text-anchor="middle" class="node-title">HTTP Workflow APIs</text>
    <text x="915" y="510" text-anchor="middle" class="node-text">/api/analyze-jobs, /api/runs</text>
    <text x="915" y="531" text-anchor="middle" class="node-text">/api/projects, events</text>
    <text x="915" y="552" text-anchor="middle" class="node-text">task statuses + audits</text>

    <rect x="125" y="650" width="220" height="92" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="235" y="683" text-anchor="middle" class="node-title">Generated Artifacts</text>
    <text x="235" y="706" text-anchor="middle" class="node-text">output/packs + reports</text>
    <text x="235" y="727" text-anchor="middle" class="node-text">analysis pages + manifests</text>

    <rect x="490" y="650" width="220" height="92" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="600" y="683" text-anchor="middle" class="node-title">Durable JSON State</text>
    <text x="600" y="706" text-anchor="middle" class="node-text">runs, projects, events</text>
    <text x="600" y="727" text-anchor="middle" class="node-text">task_statuses + audits</text>

    <rect x="855" y="650" width="220" height="92" rx="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="965" y="683" text-anchor="middle" class="node-title">Research Handoff</text>
    <text x="965" y="706" text-anchor="middle" class="node-text">deliverable report links</text>
    <text x="965" y="727" text-anchor="middle" class="node-text">filtered queue briefs</text>
  </g>

  <rect x="970" y="760" width="218" height="74" rx="10" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="988" y="783" class="legend-title">Legend</text>
  <line x1="988" y1="802" x2="1023" y2="802" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow-claude)"/>
  <text x="1035" y="807" class="legend-text">Read / transform</text>
  <line x1="988" y1="824" x2="1023" y2="824" stroke="#5a5a5a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-claude)"/>
  <text x="1035" y="829" class="legend-text">Persist / write</text>
</svg>
