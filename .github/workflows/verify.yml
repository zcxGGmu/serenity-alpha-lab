name: Verify

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "*"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      SERENITY_EXTERNAL_INTEGRATIONS_ENABLED: "false"
      SERENITY_RESEARCH_AGENTS_ENABLED: "false"
      SERENITY_RESEARCH_BOT_ENABLED: "false"
      SERENITY_RESEARCH_MONITORS_ENABLED: "false"
      SERENITY_RESEARCH_MONITOR_NOTIFICATIONS_ENABLED: "false"
      SERENITY_MARKET_DATA_API_KEY: ""
      SERENITY_NOTIFICATION_CHANNELS: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/serenity-web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Install frontend dependencies
        working-directory: apps/serenity-web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/serenity-web
        run: npx playwright install --with-deps chromium

      - name: Run unified offline release gate
        run: PYTHONPATH=src python3 scripts/verify_offline_release.py
